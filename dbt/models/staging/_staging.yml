version: 2

models:
  - name: stg_postings
    description: One row per validated, de-duplicated posting.
    columns:
      - name: posting_id
        data_tests: [unique, not_null]
      - name: company
        data_tests: [not_null]
      - name: title
        data_tests: [not_null]
      - name: seniority
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [junior, mid, senior, staff, lead]
      - name: remote_policy
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [remote, hybrid, onsite]
      - name: salary_currency
        data_tests:
          - accepted_values:
              arguments:
                values: [USD, EUR, GBP]
                quote: true

  - name: stg_posting_skills
    description: One row per (posting, canonical skill).
    columns:
      - name: posting_skill_id
        data_tests: [unique, not_null]
      - name: posting_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_postings')
                field: posting_id
      - name: skill
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('skill_taxonomy')
                field: skill
