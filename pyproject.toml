[project]
name = "llm-etl"
version = "0.1.0"
description = "LLM-powered ELT: unstructured job postings -> validated silver -> dbt-modeled gold marts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.70",
    "pydantic>=2.8",
    "duckdb>=1.1",
    "numpy>=2.0",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
]

[project.scripts]
llm-etl = "llm_etl.pipeline:main"

[dependency-groups]
airflow = [
    "apache-airflow>=3.0",
]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
ignore = ["E731", "B007", "B905"]  # small local lambdas; `attempt` is read after the loop; zip lengths are fixed
